name: Deploy SkuliNode

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_IP }}
          username: skulinode
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /home/skulinode/app/deploy.sh
